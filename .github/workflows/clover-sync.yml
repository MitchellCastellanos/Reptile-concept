# Clover is the source of truth for price, quantity and in-person sales.
# Vercel's free (Hobby) plan only allows a cron once a day, so this calls the
# same reconcile route every 10 minutes as a backstop for the Clover webhook.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SITE_URL     e.g. https://reptiles-concept.ca  (no trailing slash)
#   CRON_SECRET  same value as the CRON_SECRET env var on Vercel
# Without SITE_URL the job exits quietly, so it is safe to merge before setup.
name: Clover sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/clover-sync
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set; skipping."
            exit 0
          fi
          curl --fail --show-error --silent --max-time 240 \
            ${CRON_SECRET:+-H "Authorization: Bearer $CRON_SECRET"} \
            "$SITE_URL/api/cron/clover-sync"
